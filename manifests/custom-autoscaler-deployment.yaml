apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-autoscaler-deployment
  namespace: default
  labels:
    app: custom-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-autoscaler
  template:
    metadata:
      labels:
        app: custom-autoscaler
    spec:
      serviceAccountName: python-client-sa  # Connects with your applied RBAC role bindings
      containers:
      - name: autoscaler-container
        image: autoscaler:latest
        imagePullPolicy: Never
        env:
        # Override the default URL so it can reach Prometheus inside the cluster network
        - name: PROMETHEUS_URL
          value: "http://prometheus-operated.monitoring.svc:9090"