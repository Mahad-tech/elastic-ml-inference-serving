apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher-deployment
  namespace: default
  labels:
    app: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      containers:
      - name: dispatcher-container
        image: dispatcher:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001 
        - containerPort: 9000  
        env:
        - name: ML_SERVICE_URL 
          value: "http://ml-app-service:5000"
        - name: NUM_WORKERS
          value: "30"                          
        - name: HTTP_MAX_CONNECTIONS
          value: "500"                         # Prevents backups at the dispatcher's network interface card
        - name: HTTP_MAX_KEEPALIVE_CONNECTIONS
          value: "100"                         
        - name: WORKER_SLEEP_SECONDS
          value: "0.0"                         # Eliminates any synthetic loop delays inside consumer tasks
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher-service
  labels:
    app: dispatcher
spec:
  type: NodePort
  selector:
    app: dispatcher
  ports:
    - name: http
      port: 8001        
      targetPort: 8001  
      nodePort: 32028
    - name: metrics
      port: 9000
      targetPort: 9000
      nodePort: 32084