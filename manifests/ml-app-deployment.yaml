apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-app-deployment
  namespace: default
  labels:
    app: ml-app
spec:
  replicas: 1  # Starts at MIN_REPLICAS baseline
  selector:
    matchLabels:
      app: ml-app
  template:
    metadata:
      labels:
        app: ml-app
    spec:
      containers:
      - name: ml-app-container
        image: ml-app:latest
        imagePullPolicy: Never  # Forces Minikube to use local image
        ports:
        - containerPort: 8000  # FastAPI default port
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000         # Fixed: Aligned directly with your FastAPI runtime port
          initialDelaySeconds: 2 # Give Python 2 seconds to execute the cold framework imports
          periodSeconds: 1       # High-frequency checking for instant traffic routing
          failureThreshold: 15   # Max time allowed for downloading/loading model weights
        resources:
          requests:
            cpu: "200m"        # Reserves 0.2 of a CPU core initially
            memory: "256Mi"    # Reserves 256 Megabytes
          limits:
            cpu: "1"           # Can burst to 1 full core during busy inference requests
            memory: "768Mi"    # Strict upper ceiling per pod
---
apiVersion: v1
kind: Service
metadata:
  name: ml-app-service
  namespace: default
spec:
  selector:
    app: ml-app
  ports:
  - protocol: TCP
    port: 5000         # The internal network port other components query
    targetPort: 8000   # Routes directly to your container's FastAPI port
  type: ClusterIP