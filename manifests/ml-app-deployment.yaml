apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-app-deployment
  namespace: default
  labels:
    app: ml-app
spec:
  replicas: 1  # Starts at MIN_REPLICAS baseline
  selector:
    matchLabels:
      app: ml-app
  template:
    metadata:
      labels:
        app: ml-app
    spec:
      containers:
      - name: ml-app-container
        image: ml-app:latest
        imagePullPolicy: Never  # Forces Minikube to use the image
        ports:
        - containerPort: 8000  # FastAPI default port
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-app-service
  namespace: default
spec:
  selector:
    app: ml-app
  ports:
  - protocol: TCP
    port: 5000         # The port components use to talk inside the cluster
    targetPort: 8000   # Routes directly to the container's FastAPI port
  type: ClusterIP      